name: Quality Gate

on:
  pull_request:
  push:
    # PRs already test the synthetic merge. Avoid a second full run per push.
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Agent guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classify changed files
        env:
          AGENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AGENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # Uses only Node built-ins; dependency installation adds no coverage.
        run: node scripts/agent-guardrails.mjs

  fast-quality:
    name: Fast quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm run test:run
      - name: Production build
        run: npm run build

  e2e-chrome-shards:
    name: Chrome shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Keep aligned with package-lock.json; ciWorkflow.test.js verifies this.
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --init --ipc=host
    env:
      # Both npm ci invocations share downloads despite Firebase's fake HOME.
      npm_config_cache: ${{ github.workspace }}/.tmp/npm-cache
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/playwright-shard
        with:
          project: Desktop Chrome
          browser: chromium
          shard: ${{ matrix.shard }}
          total: 8

  e2e-safari-shards:
    name: Safari shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --init --ipc=host
    env:
      npm_config_cache: ${{ github.workspace }}/.tmp/npm-cache
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/playwright-shard
        with:
          project: Mobile Safari
          browser: webkit
          shard: ${{ matrix.shard }}
          total: 8

  e2e-chrome:
    name: Playwright E2E (Desktop Chrome)
    needs: e2e-chrome-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Chrome shard
        env:
          SHARD_RESULT: ${{ needs.e2e-chrome-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "Chrome shards did not all pass: $SHARD_RESULT"
            exit 1
          fi

  e2e-safari:
    name: Playwright E2E (Mobile Safari)
    needs: e2e-safari-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Safari shard
        env:
          SHARD_RESULT: ${{ needs.e2e-safari-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "Safari shards did not all pass: $SHARD_RESULT"
            exit 1
          fi

  e2e:
    name: Playwright E2E
    needs: [e2e-chrome, e2e-safari]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install report tools
        run: npm ci --ignore-scripts
      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-${{ github.run_id }}-*
          path: .tmp/blob-reports
          merge-multiple: true
      - name: Merge complete report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .tmp/e2e-results.json
        run: npx playwright merge-reports --reporter=html,json .tmp/blob-reports
      - name: Verify exact test coverage
        run: |
          npx playwright test --list --reporter=json > .tmp/e2e-expected.json
          node scripts/verify-playwright-report.mjs .tmp/e2e-expected.json .tmp/e2e-results.json
      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            .tmp/e2e-results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Require both browser gates
        if: always()
        env:
          CHROME_RESULT: ${{ needs.e2e-chrome.result }}
          SAFARI_RESULT: ${{ needs.e2e-safari.result }}
        run: |
          if [ "$CHROME_RESULT" != "success" ] || [ "$SAFARI_RESULT" != "success" ]; then
            echo "Browser gates: Chrome=$CHROME_RESULT Safari=$SAFARI_RESULT"
            exit 1
          fi
